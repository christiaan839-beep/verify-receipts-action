# Type check, lint, unit tests with coverage, the dist/ freshness check, and a run of the
# bundle in a network namespace with no interfaces up.
name: ci

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read # check out the code

# Keyed on the calling workflow too, so a tag push's own run never cancels
# the run that release.yml makes; only pull request runs are superseded.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vendor:
    name: Vendored copies match verifiable-receipts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The verifiable-receipts commit src/vendor/ and test/fixtures/ come from.
      VR_REF: 4d9943a99376527f742dcfdf93652ed040a51b43
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: christiaan839-beep/verifiable-receipts
          ref: ${{ env.VR_REF }}
          path: upstream
          persist-credentials: false
      - name: Every vendored file names VR_REF, and the fixtures are byte-identical
        run: |
          set -euo pipefail
          for f in src/vendor/verifiable-receipts/*.ts third_party/verifiable-receipts/README.md test/fixtures/conformance/README.md; do
            grep -q "$VR_REF" "$f" || { echo "::error file=$f::does not name $VR_REF"; exit 1; }
          done
          up=upstream/packages/verifiable-receipts/conformance
          diff <(cd "$up/fixtures" && ls) <(cd test/fixtures/conformance && ls -- *.json)
          for f in "$up"/fixtures/*.json; do
            cmp "$f" "test/fixtures/conformance/$(basename "$f")"
          done
          cmp "$up/public-key.pem" test/fixtures/conformance/public-key.pem

  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The unit tests, with line, branch and function coverage of src/.
      # The thresholds are in the coverage script in package.json; a drop
      # below them fails the step.
      - name: Tests, with coverage
        run: |
          set -o pipefail
          npm run coverage | tee "$RUNNER_TEMP/coverage.txt"
      - name: Coverage in the job summary
        if: ${{ !cancelled() }}
        env:
          NODE: ${{ matrix.node }}
        run: |
          {
            echo "### Coverage of src/ (Node $NODE)"
            echo
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/{s/^ℹ //;p;}' "$RUNNER_TEMP/coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: dist/ matches the sources
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::dist/ is out of date. Run npm run build and commit dist/."
            exit 1
          fi
      - name: The bundle verifies with no network
        run: |
          out="$RUNNER_TEMP/no-network-output"
          : > "$out"
          sudo unshare --net -- env \
            "GITHUB_WORKSPACE=$PWD" "GITHUB_OUTPUT=$out" \
            "INPUT_RECEIPTS=selftest/receipts/valid/*.json" \
            "INPUT_PUBLIC-KEYS-FILE=selftest/keys/issuer.pem" \
            "INPUT_TREE-HEAD=selftest/log/tree-head.json" \
            "INPUT_LOG-PUBLIC-KEYS-FILE=selftest/keys/log.pem" \
            "INPUT_INCLUSION-PROOFS=selftest/log/proofs/*.json" \
            "$(command -v node)" dist/index.js
          grep -A1 '^verified<<' "$out" | grep -qx 2
