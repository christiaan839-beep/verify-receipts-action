# Runs the action at the commit under test (uses: $/) on the files in selftest/
# and checks its outputs: valid receipts pass with inclusion confirmed,
# forged and tampered receipts fail, and a receipt with no inclusion proof
# fails.
name: self-test

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read # check out the action and the self-test files

# Keyed on the calling workflow too, so a tag push's own run never cancels
# the run that release.yml makes; only pull request runs are superseded.
concurrency:
  group: ${{ github.workflow }}-self-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  self-test:
    name: Self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Valid receipts, in the log
        id: valid
        uses: $/
        with:
          receipts: selftest/receipts/valid/*.json
          public-keys-file: selftest/keys/issuer.pem
          tree-head: selftest/log/tree-head.json
          log-public-keys-file: selftest/keys/log.pem
          inclusion-proofs: selftest/log/proofs/*.json

      - name: Check the valid run
        env:
          TOTAL: ${{ steps.valid.outputs.total }}
          VERIFIED: ${{ steps.valid.outputs.verified }}
          FAILED: ${{ steps.valid.outputs.failed }}
        run: |
          test "$TOTAL" = 2
          test "$VERIFIED" = 2
          test "$FAILED" = 0

      - name: Forged and tampered receipts, reported as warnings
        id: invalid
        uses: $/
        with:
          receipts: selftest/receipts/invalid/*.json
          public-keys-file: selftest/keys/issuer.pem
          fail-on-invalid: "false"

      - name: Check the invalid run
        env:
          VERIFIED: ${{ steps.invalid.outputs.verified }}
          FAILED: ${{ steps.invalid.outputs.failed }}
          FAILURES: ${{ steps.invalid.outputs.failures }}
        run: |
          test "$VERIFIED" = 0
          test "$FAILED" = 4
          printf '%s' "$FAILURES" | grep -q 'contentHash mismatch'
          printf '%s' "$FAILURES" | grep -q 'signature does not verify'
          printf '%s' "$FAILURES" | grep -q 'envelope field \\"overall\\" disagrees'
          printf '%s' "$FAILURES" | grep -q 'unsupported signature algorithm'

      - name: Forged and tampered receipts fail the step
        id: strict
        continue-on-error: true
        uses: $/
        with:
          receipts: selftest/receipts/invalid/*.json
          public-keys-file: selftest/keys/issuer.pem

      - name: Valid receipts with no inclusion proof
        id: unproven
        continue-on-error: true
        uses: $/
        with:
          receipts: selftest/receipts/valid/*.json
          public-keys-file: selftest/keys/issuer.pem
          tree-head: selftest/log/tree-head.json
          log-public-keys-file: selftest/keys/log.pem
          inclusion-proofs: selftest/log/no-such-dir/*.json

      - name: Check the failing runs
        env:
          STRICT: ${{ steps.strict.outcome }}
          UNPROVEN: ${{ steps.unproven.outcome }}
          UNPROVEN_FAILED: ${{ steps.unproven.outputs.failed }}
        run: |
          test "$STRICT" = failure
          test "$UNPROVEN" = failure
          test "$UNPROVEN_FAILED" = 2
